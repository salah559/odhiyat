<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تواصل معنا - Odhiyaty</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/style.css?v=20251122">
</head>
<body>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js"></script>
    <script src="/assets/js/firebase-auth.js?v=20251122"></script>
    <script>
        firebase.auth().onAuthStateChanged((user) => {
            if (!user) {
                window.location.href = '/login.html';
            }
        });
    </script>
    <nav class="navbar">
        <div class="container">
            <a href="/" class="navbar-brand">
                <img src="/assets/images/logos/logo.png" alt="Odhiyaty Logo">
                <span>أضحيتي</span>
            </a>
            <ul class="navbar-menu">
                <li><a href="/">الرئيسية</a></li>
                <li><a href="/products.html">الأضاحي</a></li>
                <li><a href="/contact.html" class="active">تواصل معنا</a></li>
                <li><a href="#" onclick="logout(); return false;" style="background: linear-gradient(135deg, var(--primary-gold) 0%, var(--gold-light) 100%); padding: 0.7rem 1.5rem; border-radius: 30px;">تسجيل خروج</a></li>
            </ul>
        </div>
    </nav>

    <section class="section">
        <div class="container">
            <h2 class="section-title">تواصل معنا</h2>
            
            <div class="contact-form">
                <div id="contactMessage"></div>
                
                <form id="contactForm">
                    <div class="form-group">
                        <label>الاسم الكامل *</label>
                        <input type="text" name="name" id="name" required>
                    </div>
                    
                    <div class="form-group">
                        <label>البريد الإلكتروني *</label>
                        <input type="email" name="email" id="email" required>
                    </div>
                    
                    <div class="form-group">
                        <label>رقم الهاتف</label>
                        <input type="tel" name="phone" id="phone">
                    </div>
                    
                    <div class="form-group">
                        <label>الموضوع</label>
                        <input type="text" name="subject" id="subject">
                    </div>
                    
                    <div class="form-group">
                        <label>الرسالة *</label>
                        <textarea name="message" id="message" rows="6" required></textarea>
                    </div>
                    
                    <button type="submit" class="btn" style="width: 100%;">إرسال الرسالة</button>
                </form>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <p>&copy; <span id="currentYear"></span> أضحيتي - Odhiyaty. جميع الحقوق محفوظة.</p>
            <p>منصة احترافية لبيع الأضاحي والأغنام</p>
        </div>
    </footer>

    <script src="/assets/js/api.js"></script>
    <script>
        document.getElementById('currentYear').textContent = new Date().getFullYear();

        const form = document.getElementById('contactForm');
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData(form);
            const contactData = {
                name: formData.get('name'),
                email: formData.get('email'),
                phone: formData.get('phone'),
                subject: formData.get('subject'),
                message: formData.get('message'),
                csrf_token: await getCSRFToken()
            };
            
            const messageDiv = document.getElementById('contactMessage');
            
            const result = await apiRequest('/api/contact.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(contactData)
            });
            
            if (result.success) {
                messageDiv.innerHTML = `<div class="alert alert-success">${result.message}</div>`;
                form.reset();
            } else {
                messageDiv.innerHTML = `<div class="alert alert-error">${result.message}</div>`;
            }
        });
    </script>
</body>
</html>
