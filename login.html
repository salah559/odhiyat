<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - أضحيتي</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/style.css?v=20251122">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="auth-page">
    <div class="auth-bg">
        <img src="/attached_assets/LOADING_1763829258959.gif" alt="خروف">
    </div>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>أضحيتي</h1>
                <p>تسجيل الدخول</p>
            </div>

            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="email">البريد الإلكتروني</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="password">كلمة المرور</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <button type="submit" class="btn btn-auth">تسجيل الدخول</button>
            </form>

            <div class="auth-divider">أو</div>

            <div id="g_id_onload" data-client_id="1012633568925-8h9v0h4jqv8j6c5n8c8c8c8c8c8c8c8c.apps.googleusercontent.com" data-callback="handleCredentialResponse"></div>
            <div class="g_id_signin" data-type="standard"></div>

            <p class="auth-switch">
                ليس لديك حساب؟
                <a href="/signup.html">إنشاء حساب جديد</a>
            </p>

            <div id="authMessage" class="auth-message"></div>
        </div>
    </div>

    <script src="/assets/js/auth.js"></script>
</body>
</html>
