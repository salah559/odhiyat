<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب - أضحيتي</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/style.css?v=20251122">
    <link rel="stylesheet" href="/assets/css/auth.css?v=20251122">
</head>
<body>
    <section class="auth-section auth-hero">
        <div class="auth-bg-image">
            <img src="/attached_assets/LOADING_1763829258959.gif" alt="خروف">
        </div>
        
        <div class="auth-container">
            <div class="auth-card">
                <div class="auth-header">
                    <img src="/assets/images/logos/logo.png" alt="أضحيتي" class="auth-logo">
                    <h1>أضحيتي</h1>
                    <p>إنشاء حساب جديد</p>
                </div>

                <div id="authMessage"></div>

                <form id="registerForm" class="auth-form">
                    <div class="form-group">
                        <label for="fullName">الاسم الكامل</label>
                        <input type="text" id="fullName" name="fullName" placeholder="محمد أحمد" required>
                    </div>

                    <div class="form-group">
                        <label for="email">البريد الإلكتروني</label>
                        <input type="email" id="email" name="email" placeholder="example@email.com" required>
                    </div>

                    <div class="form-group">
                        <label for="password">كلمة المرور</label>
                        <input type="password" id="password" name="password" placeholder="••••••••" required minlength="6">
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">تأكيد كلمة المرور</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="••••••••" required>
                    </div>

                    <div class="form-group">
                        <label for="userType">نوع الحساب</label>
                        <select id="userType" name="userType" required>
                            <option value="">اختر نوع الحساب</option>
                            <option value="buyer">مشتري</option>
                            <option value="seller">بائع</option>
                        </select>
                    </div>

                    <div class="form-group" id="sellerDetails" style="display:none;">
                        <label for="businessName">اسم المتجر/الشركة</label>
                        <input type="text" id="businessName" name="businessName" placeholder="اسم المتجر">
                    </div>

                    <button type="submit" class="btn btn-auth">إنشاء الحساب</button>
                </form>

                <div class="auth-footer">
                    <p>هل لديك حساب بالفعل؟ <a href="/login.html">تسجيل الدخول</a></p>
                </div>
            </div>
        </div>
    </section>

    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js"></script>
    <script src="/assets/js/firebase-auth.js?v=20251122"></script>
    <script>
        const registerForm = document.getElementById('registerForm');
        const userTypeSelect = document.getElementById('userType');
        const sellerDetails = document.getElementById('sellerDetails');
        const authMessage = document.getElementById('authMessage');

        userTypeSelect.addEventListener('change', (e) => {
            if (e.target.value === 'seller') {
                sellerDetails.style.display = 'block';
            } else {
                sellerDetails.style.display = 'none';
            }
        });

        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const fullName = document.getElementById('fullName').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const userType = document.getElementById('userType').value;
            const businessName = document.getElementById('businessName').value;

            if (password !== confirmPassword) {
                showMessage('كلمات المرور غير متطابقة', 'error');
                return;
            }

            try {
                const result = await firebase.auth().createUserWithEmailAndPassword(email, password);
                
                await result.user.updateProfile({
                    displayName: fullName
                });

                // Save additional user data
                const userData = {
                    email: email,
                    fullName: fullName,
                    userType: userType,
                    businessName: userType === 'seller' ? businessName : null,
                    createdAt: new Date().toISOString()
                };

                // Save to localStorage for now (could be saved to backend/database)
                localStorage.setItem(`user_${result.user.uid}`, JSON.stringify(userData));
                localStorage.setItem('userType', userType);

                showMessage('تم إنشاء الحساب بنجاح!', 'success');
                setTimeout(() => {
                    window.location.href = '/';
                }, 1500);
            } catch (error) {
                showMessage('خطأ: ' + translateFirebaseError(error.code), 'error');
            }
        });

        function showMessage(message, type = 'success') {
            authMessage.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
            authMessage.scrollIntoView({ behavior: 'smooth' });
        }

        function translateFirebaseError(code) {
            const errors = {
                'auth/email-already-in-use': 'البريد الإلكتروني مستخدم بالفعل',
                'auth/invalid-email': 'البريد الإلكتروني غير صحيح',
                'auth/weak-password': 'كلمة المرور ضعيفة جداً',
                'auth/operation-not-allowed': 'العملية غير متاحة',
                'auth/too-many-requests': 'محاولات كثيرة. حاول لاحقاً'
            };
            return errors[code] || 'حدث خطأ ما';
        }

        // Check if already logged in
        firebase.auth().onAuthStateChanged((user) => {
            if (user) {
                window.location.href = '/';
            }
        });
    </script>
</body>
</html>
