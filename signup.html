<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب - أضحيتي</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/style.css?v=20251122">
</head>
<body class="auth-page">
    <div class="auth-bg">
        <img src="/attached_assets/LOADING_1763829258959.gif" alt="خروف">
    </div>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>أضحيتي</h1>
                <p>إنشاء حساب جديد</p>
            </div>

            <div class="account-type-selector">
                <label class="account-type-option">
                    <input type="radio" name="accountType" value="buyer" checked>
                    <span class="type-label">
                        <span class="type-icon">🛒</span>
                        <span class="type-name">مشتري</span>
                    </span>
                </label>
                <label class="account-type-option">
                    <input type="radio" name="accountType" value="seller">
                    <span class="type-label">
                        <span class="type-icon">🐑</span>
                        <span class="type-name">بائع</span>
                    </span>
                </label>
            </div>

            <form id="signupForm" class="auth-form">
                <div class="form-group">
                    <label for="fullName">الاسم الكامل</label>
                    <input type="text" id="fullName" name="fullName" required>
                </div>

                <div class="form-group">
                    <label for="signupEmail">البريد الإلكتروني</label>
                    <input type="email" id="signupEmail" name="email" required>
                </div>

                <div class="form-group">
                    <label for="signupPassword">كلمة المرور</label>
                    <input type="password" id="signupPassword" name="password" required>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">تأكيد كلمة المرور</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required>
                </div>

                <button type="submit" class="btn btn-auth">إنشاء الحساب</button>
            </form>

            <div class="auth-divider">أو</div>

            <button id="googleSignup" class="btn btn-google">
                <span>إنشاء حساب عبر Google</span>
            </button>

            <p class="auth-switch">
                هل لديك حساب بالفعل؟
                <a href="/login.html">تسجيل الدخول</a>
            </p>

            <div id="authMessage" class="auth-message"></div>
        </div>
    </div>

    <script src="https://unpkg.com/firebase@9.23.0/app/dist/index.global.js"></script>
    <script src="https://unpkg.com/firebase@9.23.0/auth/dist/index.global.js"></script>
    <script src="https://unpkg.com/firebase@9.23.0/firestore/dist/index.global.js"></script>
    <script src="/assets/js/firebase-config.js"></script>
    <script src="/assets/js/auth.js"></script>
</body>
</html>
